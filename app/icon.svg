<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 8-bit pixel grid favicon: Git commit node -->
  <style>
    rect { shape-rendering: crispEdges; }
  </style>
  <!-- Background -->
  <rect width="32" height="32" fill="#09090b"/>
  <!-- Vertical branch line (top) -->
  <rect x="14" y="0" width="4" height="10" fill="#3f3f46"/>
  <!-- Vertical branch line (bottom) -->
  <rect x="14" y="22" width="4" height="10" fill="#3f3f46"/>
  <!-- Commit node outer ring (pixel circle) -->
  <rect x="10" y="10" width="4" height="2" fill="#22c55e"/>
  <rect x="18" y="10" width="4" height="2" fill="#22c55e"/>
  <rect x="10" y="20" width="4" height="2" fill="#22c55e"/>
  <rect x="18" y="20" width="4" height="2" fill="#22c55e"/>
  <rect x="8" y="12" width="2" height="8" fill="#22c55e"/>
  <rect x="22" y="12" width="2" height="8" fill="#22c55e"/>
  <!-- Commit node inner fill -->
  <rect x="10" y="12" width="12" height="8" fill="#22c55e"/>
  <!-- Inner dot (darker center) -->
  <rect x="14" y="14" width="4" height="4" fill="#16a34a"/>
</svg>
